<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB Test</title>
<style>body{margin:0;background:#333}canvas{display:block}</style>
</head><body>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x334455);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);
camera.position.set(5,3,7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.8,0);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xffffff,1));
const dl=new THREE.DirectionalLight(0xffffff,2);
dl.position.set(5,8,4);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x8899ff,.5);
dl2.position.set(-5,3,-5);scene.add(dl2);

const loader=new GLTFLoader();
loader.load('es9.glb',g=>{
  const car=g.scene;
  // Replace with simple visible materials
  const mats=[
    new THREE.MeshStandardMaterial({color:0x2d4f42,side:THREE.DoubleSide}), // green
    new THREE.MeshStandardMaterial({color:0x222222,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xcccccc,metalness:1,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0x223344,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x444444,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0x333333,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0x888888,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0x666677,metalness:.9,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0x111111,side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xcc2222,side:THREE.DoubleSide}),
  ];
  let i=0;
  car.traverse(c=>{
    if(c.isMesh){
      c.material=mats[i%mats.length];
      document.title=c.name+' loaded';
      i++;
    }
  });
  scene.add(car);
  console.log('Car loaded with',i,'meshes');
},xhr=>{
  if(xhr.total)document.title=Math.round(xhr.loaded/xhr.total*100)+'%';
},e=>{
  document.body.innerHTML='<h1 style="color:red">ERROR: '+e.message+'</h1>';
  console.error(e);
});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
</script></body></html>
