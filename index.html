<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>蔚来 ES9 行政签名版 6座</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eff0f2;width:100%;height:100%;touch-action:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%}
#c canvas{display:block}
.ld{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#00bfa5;font-size:15px;z-index:200;text-align:center}
.sp{width:32px;height:32px;border:3px solid rgba(0,191,165,.2);border-top-color:#00bfa5;border-radius:50%;margin:0 auto 10px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.tb{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;z-index:100;background:linear-gradient(to bottom,rgba(245,246,248,.9),transparent);pointer-events:none}
.tb .t{color:#1a1d26;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.tb .b{background:rgba(0,191,165,.12);color:#009688;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.cp{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px 20px 0 0;z-index:100;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);transition:transform .3s cubic-bezier(.4,0,.2,1);border-top:1px solid rgba(0,0,0,.06);box-shadow:0 -4px 24px rgba(0,0,0,.06)}
.cp.off{transform:translateY(104%)}
.ph{display:flex;align-items:center;justify-content:center;position:relative;padding:6px 0 10px;cursor:grab;touch-action:none}
.ph:active{cursor:grabbing}
.ph .bar{width:38px;height:4px;border-radius:2px;background:rgba(0,0,0,.18)}
.fold{position:absolute;right:12px;top:0;display:flex;align-items:center;gap:4px;font-size:11px;color:#9aa0ab;padding:5px 6px;pointer-events:none}
.fold .cv{width:7px;height:7px;border-right:1.6px solid #9aa0ab;border-bottom:1.6px solid #9aa0ab;transform:rotate(45deg) translate(-1px,-1px)}
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:101;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 6px 22px rgba(0,0,0,.16);border-radius:24px;padding:11px 18px;font-size:14px;color:#009688;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transform:translateY(24px);transition:all .32s cubic-bezier(.4,0,.2,1);cursor:pointer}
#fab.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#fab .ic{width:16px;height:16px;border-radius:50%;border:2px solid #00bfa5;position:relative}
#fab .ic::after{content:'';position:absolute;width:2px;height:2px;border-radius:50%;background:#00bfa5;left:5px;top:5px}
.cname{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:50%;z-index:90;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:7px 20px;border-radius:18px;font-size:16px;font-weight:700;color:#1a1d26;letter-spacing:2px;box-shadow:0 2px 12px rgba(0,0,0,.06);pointer-events:none;opacity:.92;transform:translateX(-50%)}
.cname.flash{animation:flash 1.1s ease}
@keyframes flash{0%{opacity:0;transform:translateX(-50%) translateY(-6px)}18%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:.92;transform:translateX(-50%) translateY(0)}}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ph2 .l{font-size:13px;color:#8a909c}
.ph2 .cn{font-size:15px;color:#009688;font-weight:700}
.rw{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sw{display:flex;gap:8px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.sw::-webkit-scrollbar{display:none}
.s{width:34px;height:34px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:transform .15s,border-color .15s}
.s:active{transform:scale(.9)}
.s.on{border-color:#00bfa5;box-shadow:0 0 0 2px rgba(0,191,165,.35)}
.so{display:flex;gap:8px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
.so::-webkit-scrollbar{display:none}
.ob{padding:8px 14px;border-radius:20px;background:#f0f1f3;color:#5a606b;font-size:13px;border:1px solid transparent;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:all .15s}
.ob.on{background:rgba(0,191,165,.14);color:#009688;border-color:rgba(0,191,165,.45)}
.tr{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(0,0,0,.06)}
.tr span{font-size:14px;color:#5a606b}
.sl{width:44px;height:26px;background:rgba(0,0,0,.12);border-radius:13px;cursor:pointer;position:relative;transition:background .2s}
.sl.on{background:#00bfa5}
.sl::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);top:2px;left:2px;transition:transform .2s}
.sl.on::after{transform:translateX(18px)}
.ht{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);color:rgba(26,29,38,.35);font-size:12px;z-index:50;pointer-events:none;text-align:center}

@media(max-width:400px){
 .ob{padding:7px 10px;font-size:12px}
 .s{width:32px;height:32px}
 .ph2 .cn{font-size:14px}
 .cp{padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
}
</style>
</head>
<body>
<div id="c"></div>
<div class="ld" id="ld"><div class="sp"></div><div id="ldt">正在加载 ES9 3D模型...</div></div>
<div class="tb"><div class="t">蔚来 ES9 <span class="b">行政签名版 6座</span></div></div>
<div class="cname" id="cname">星辰绿</div>
<div class="ht">单指拖动旋转 · 双指缩放</div>
<div class="cp" id="cp">
<div class="ph" id="ph"><div class="bar"></div><div class="fold">全屏<div class="cv"></div></div></div>
<div class="ph2"><span class="l">车身颜色</span><span class="cn" id="cn">星辰绿</span></div>
<div class="rw"><div class="sw" id="sw"></div></div>
<div class="rw"><div class="so" id="so">
<div class="ob on" data-p="rear">车尾门</div>
<div class="ob" data-p="hood">引擎盖</div>
<div class="ob" data-p="left">左车门</div>
<div class="ob" data-p="right">右车门</div>
<div class="ob" data-p="none">无贴纸</div>
</div></div>
<div class="tr"><span>自动旋转</span><div class="sl on" id="ar"></div></div>
</div>
<div id="fab"><span class="ic"></span>外观设置</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const COLORS={
 green:{n:'星辰绿',h:0x515c5a},silver:{n:'月辉银',h:0x949699},white:{n:'云白',h:0xe0e2e3},
 black:{n:'极夜黑',h:0x454545},gold:{n:'晨晖金',h:0xccb08f},red:{n:'M42 星云红',h:0x5c373c},blue:{n:'南极星蓝',h:0x4a5266}
};

const container=document.getElementById('c');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeff0f2);
const isPortrait=()=>innerWidth/innerHeight<0.75;
const camera=new THREE.PerspectiveCamera(isPortrait()?52:40,innerWidth/innerHeight,.1,100);
camera.position.set(-4.5,2.4,6.6);
if(isPortrait()){camera.position.multiplyScalar(1.42);}
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
container.appendChild(renderer.domElement);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.target.set(0,.85,0);controls.minDistance=3;controls.maxDistance=15;
controls.maxPolarAngle=Math.PI*.92;controls.minPolarAngle=.05;
controls.autoRotate=true;controls.autoRotateSpeed=1.5;controls.enablePan=false;

const dl=new THREE.DirectionalLight(0xffffff,1.85);dl.position.set(5,8,4);dl.castShadow=true;
dl.shadow.mapSize.set(2048,2048);dl.shadow.camera.left=-5;dl.shadow.camera.right=5;
dl.shadow.camera.top=5;dl.shadow.camera.bottom=-5;
dl.shadow.bias=-0.0004;scene.add(dl);
const fl2=new THREE.DirectionalLight(0xdde4f0,.95);fl2.position.set(-5,3,-5);scene.add(fl2);
const rl=new THREE.DirectionalLight(0xffffff,1.0);rl.position.set(0,5,-8);scene.add(rl);
scene.add(new THREE.AmbientLight(0xffffff,.8));

const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),
 new THREE.MeshStandardMaterial({color:0xe9ebed,roughness:.95,metalness:0}));
floor.rotation.x=-Math.PI/2;floor.position.y=-0.02;floor.receiveShadow=true;scene.add(floor);

// Materials
const paintMat=new THREE.MeshPhysicalMaterial({color:COLORS.green.h,metalness:.45,roughness:.28,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:.9,side:THREE.DoubleSide});
const blackMat=new THREE.MeshStandardMaterial({color:0x0a0a0c,roughness:.7,metalness:.2,side:THREE.DoubleSide});
const chromeMat=new THREE.MeshStandardMaterial({color:0xd0d0d0,metalness:1,roughness:.12,side:THREE.DoubleSide});
const glassMat=new THREE.MeshPhysicalMaterial({color:0x0c1018,metalness:.9,roughness:.05,envMapIntensity:2,transparent:true,opacity:.75,side:THREE.DoubleSide});
const lightMat=new THREE.MeshStandardMaterial({color:0xe8e8f0,metalness:.3,roughness:.2,emissive:0xffffff,emissiveIntensity:.3,side:THREE.DoubleSide});
const tireMat=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.95,side:THREE.DoubleSide});
const rimMat=new THREE.MeshStandardMaterial({color:0x888890,metalness:.9,roughness:.25,side:THREE.DoubleSide});
const caliperMat=new THREE.MeshStandardMaterial({color:0xc81e1e,metalness:.6,roughness:.3,side:THREE.DoubleSide});
const detailMat=new THREE.MeshStandardMaterial({color:0x666670,metalness:.8,roughness:.3,side:THREE.DoubleSide});
const mirrorMat=new THREE.MeshStandardMaterial({color:0x18181c,roughness:.5,metalness:.3,side:THREE.DoubleSide});

const matMap={paint:paintMat,black:blackMat,chrome:chromeMat,glass:glassMat,
 lights:lightMat,mirror:mirrorMat,details:detailMat,rim:rimMat,tire:tireMat,caliper:caliperMat};

// Individual die-cut character stickers
const CHAR_FILES=['c1.png','c2.png','c3.png','c4.png','c5.png','c6.png','c7.png'];
const CHAR_ASP=[0.90,1.03,1.30,1.21,0.99,0.61,1.06]; // width/height fallbacks
const GAP=0.03;
// two rows: heads peeking on top, full characters on bottom; {i=file index,h=unit height,t=tilt deg}
const ROWS=[
 {base:0.265,z:0.012,items:[{i:2,h:0.27,t:-4},{i:3,h:0.27,t:2},{i:4,h:0.27,t:4}]},
 {base:0,z:0,items:[{i:0,h:0.33,t:-3},{i:1,h:0.27,t:3},{i:5,h:0.35,t:-2},{i:6,h:0.26,t:4}]}
];
const stickerGroup=new THREE.Group();
const stickerInner=new THREE.Group();
stickerGroup.add(stickerInner);
const stickerMeshes=[];
CHAR_FILES.forEach((f,idx)=>{
 const tex=new THREE.TextureLoader().load('stickers/'+f,(t)=>{
  stickerMeshes[idx].userData.asp=t.image.width/t.image.height;
  sizeSticker(idx);layoutCluster();
 });
 tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
 const mat=new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:.45,metalness:0,
  polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),mat);
 mesh.userData={asp:CHAR_ASP[idx],h:0};
 stickerMeshes.push(mesh);stickerInner.add(mesh);
});
function sizeSticker(idx){const m=stickerMeshes[idx];m.scale.set(m.userData.h*m.userData.asp,m.userData.h,1);}
function rowWidth(row){return row.items.reduce((a,it)=>a+it.h*stickerMeshes[it.i].userData.asp,0)+GAP*(row.items.length-1);}
function layoutCluster(){
 let Wc=0,Hc=0;
 ROWS.forEach(row=>{
  const ws=row.items.map(it=>it.h*stickerMeshes[it.i].userData.asp);
  const tot=ws.reduce((a,b)=>a+b,0)+GAP*(row.items.length-1);
  Wc=Math.max(Wc,tot);Hc=Math.max(Hc,row.base+Math.max(...row.items.map(it=>it.h)));
  let x=-tot/2;
  row.items.forEach((it,j)=>{const m=stickerMeshes[it.i];m.userData.h=it.h;sizeSticker(it.i);
   x+=ws[j]/2;m.position.set(x,row.base+it.h/2,row.z);m.rotation.z=it.t*Math.PI/180;x+=ws[j]/2+GAP;});
 });
 stickerGroup.userData.W=Wc;stickerInner.position.y=-Hc/2;
 if(stickerGroup.visible&&stickerGroup.userData.curw)stickerGroup.scale.setScalar(stickerGroup.userData.curw/Wc);
}
layoutCluster();

// Load GLB
const loader=new GLTFLoader();
loader.load('es9.glb',(gltf)=>{
 const root=gltf.scene;
 root.traverse(child=>{
  if(!child.isMesh)return;
  child.castShadow=true;child.receiveShadow=true;
  // Find material by node/mesh name
  let name=(child.name||'').toLowerCase();
  if(name.includes('caliper')){child.visible=false;return;}
  let assigned=false;
  for(const[key,mat]of Object.entries(matMap)){
   if(name.includes(key)){child.material=mat;assigned=true;break;}
  }
  if(!assigned){
   // Fallback: check parent name
   let p=child.parent;
   while(p){
    let pn=(p.name||'').toLowerCase();
    for(const[key,mat]of Object.entries(matMap)){
     if(pn.includes(key)){child.material=mat;assigned=true;break;}
    }
    if(assigned)break;p=p.parent;
   }
  }
 });
 scene.add(root);
 root.add(stickerGroup);
 layoutCluster();
 setSticker('rear');
 document.getElementById('ld').style.display='none';
 // Ensure correct framebuffer/aspect after async load (fixes blank first frame)
 const refit=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);controls.update();renderer.render(scene,camera);};
 refit();setTimeout(refit,120);setTimeout(refit,500);setTimeout(refit,1200);
},(xhr)=>{
 if(xhr.total){
  const pct=Math.min(100,Math.round(xhr.loaded/xhr.total*100));
  document.getElementById('ldt').textContent=`正在加载 ES9 3D模型... ${pct}%`;
 }
},(err)=>{
 console.error('GLB load error:',err);
 document.getElementById('ld').innerHTML='<div style="color:#ff6b6b">模型加载失败<br><span style="font-size:12px;color:#888">请刷新页面重试</span></div>';
});

// Sticker placement zones (cluster centered at p, oriented to the panel)
const sPos={
 rear:{p:[0,.99,-2.755],r:[0,Math.PI,0],w:.64},
 hood:{p:[0,1.285,1.92],r:[-Math.PI/2.15,0,0],w:.56},
 left:{p:[1.058,.92,.28],r:[0,Math.PI/2,0],w:.74},
 right:{p:[-1.058,.92,.28],r:[0,-Math.PI/2,0],w:.74}
};
function setSticker(k){
 if(k==='none'){stickerGroup.visible=false;return;}
 const s=sPos[k];stickerGroup.visible=true;
 stickerGroup.position.set(...s.p);stickerGroup.rotation.set(...s.r);
 stickerGroup.userData.curw=s.w;
 stickerGroup.scale.setScalar(s.w/stickerGroup.userData.W);
}

// UI
const cnEl=document.getElementById('cn');
const cnameEl=document.getElementById('cname');
function showColorName(n){
 cnEl.textContent=n;cnameEl.textContent=n;
 cnameEl.classList.remove('flash');void cnameEl.offsetWidth;cnameEl.classList.add('flash');
}
Object.entries(COLORS).forEach(([key,v],i)=>{
 const d=document.createElement('div');
 d.className='s'+(i===0?' on':'');
 d.style.background='#'+v.h.toString(16).padStart(6,'0');
 d.title=v.n;d.setAttribute('aria-label',v.n);
 d.onclick=()=>{
  document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));
  d.classList.add('on');
  paintMat.color.setHex(v.h);
  showColorName(v.n);
 };
 document.getElementById('sw').appendChild(d);
});
document.querySelectorAll('.ob').forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll('.ob').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');setSticker(b.dataset.p);
 };
});
const arEl=document.getElementById('ar');
arEl.onclick=()=>{arEl.classList.toggle('on');controls.autoRotate=arEl.classList.contains('on');};

// Bottom panel: drag handle down to hide (fullscreen), up to reveal; tap toggles; fab reopens
const cp=document.getElementById('cp'),ph=document.getElementById('ph'),fab=document.getElementById('fab');
function setPanel(open){cp.classList.toggle('off',!open);fab.classList.toggle('show',!open);}
let dragY=null,startOpen=true,moved=false,suppressClick=false;
ph.addEventListener('pointerdown',e=>{
 dragY=e.clientY;startOpen=!cp.classList.contains('off');moved=false;
 cp.style.transition='none';try{ph.setPointerCapture(e.pointerId);}catch(_){}
});
ph.addEventListener('pointermove',e=>{
 if(dragY===null)return;const dy=e.clientY-dragY;if(Math.abs(dy)>5)moved=true;
 if(!moved)return;
 const H=cp.offsetHeight;
 const ty=startOpen?Math.max(0,Math.min(H,dy)):Math.max(0,Math.min(H,H+dy));
 cp.style.transform=`translateY(${ty}px)`;
});
function endDrag(e){
 if(dragY===null)return;const dy=e.clientY-dragY;
 cp.style.transition='';cp.style.transform='';
 if(moved){
  suppressClick=true;setTimeout(()=>suppressClick=false,350);
  if(dy>55)setPanel(false);else if(dy<-55)setPanel(true);else setPanel(startOpen);
 }
 dragY=null;
}
ph.addEventListener('pointerup',endDrag);
ph.addEventListener('pointercancel',endDrag);
// simple tap (mouse or touch without drag) toggles the panel
ph.addEventListener('click',()=>{if(suppressClick)return;setPanel(cp.classList.contains('off'));});
fab.addEventListener('click',()=>setPanel(true));

function onResize(){
 camera.aspect=innerWidth/innerHeight;camera.fov=isPortrait()?52:40;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',onResize);
addEventListener('orientationchange',()=>setTimeout(onResize,200));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(onResize,50);});

(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
